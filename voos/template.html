<style>
  /* Tokens que a página do dashboard usa (mesmos nomes do claude.ai), com os valores do design system HIG Designer.
     Fonte do sistema (SF Pro no Mac/iPhone), azul como única cor de ação, grounds em camadas, sem sombras em superfícies. */
  :root {
    color-scheme: light;
    --color-bg: #f2f2f7;
    --color-panel: #ffffff;
    --color-fg: #000000;
    --color-fg-muted: #6c6c70;
    --color-border-line: #c6c6c8;
    --color-ok: #248a3d; --color-warn: #c93400; --color-bad: #ff3b30;
    --hig-blue: #007aff; --hig-fill: rgba(120, 120, 128, .12);
    --cds-chart-muted: #d1d1d6;
    --cds-chart-grid: #e5e5ea;
    --cds-chart-axis: #c7c7cc;
    --cds-chart-reference: #8e8e93;
    --cds-surface-popover: #ffffff;
    --cds-border: #c6c6c8;
    --cds-shadow-popover: 0 10px 15px rgba(0, 0, 0, .04), 0 4px 6px rgba(0, 0, 0, .08);
    --cds-text-secondary: #6c6c70;
    --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-anthropic-serif: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --cds-font-size-caption: .8125rem;
    --cds-font-size-body: .9375rem;
    --cds-font-size-heading: 1.0625rem;
    --cds-font-size-title: 2.125rem;
    --cds-font-weight-medium: 600;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px; --cds-gap-xl: 32px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 16px; --cds-pad-lg: 16px; --cds-pad-xl: 32px;
    --cds-radius: 16px;
    --cds-dur-slow: .2s;
    --cds-ease-out: cubic-bezier(0, 0, .58, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --color-bg: #000000; --color-panel: #1c1c1e; --color-fg: #ffffff; --color-fg-muted: #98989f;
      --color-border-line: #38383a; --color-ok: #30d158; --color-warn: #ff9f0a; --color-bad: #ff453a;
      --hig-blue: #0a84ff; --hig-fill: rgba(120, 120, 128, .24);
      --cds-chart-muted: #48484a; --cds-chart-grid: #2c2c2e; --cds-chart-axis: #48484a; --cds-chart-reference: #8e8e93;
      --cds-surface-popover: #2c2c2e; --cds-border: #38383a; --cds-shadow-popover: 0 10px 15px rgba(0, 0, 0, .3), 0 4px 6px rgba(0, 0, 0, .4); --cds-text-secondary: #98989f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-bg: #000000; --color-panel: #1c1c1e; --color-fg: #ffffff; --color-fg-muted: #98989f;
    --color-border-line: #38383a; --color-ok: #30d158; --color-warn: #ff9f0a; --color-bad: #ff453a;
    --hig-blue: #0a84ff; --hig-fill: rgba(120, 120, 128, .24);
    --cds-chart-muted: #48484a; --cds-chart-grid: #2c2c2e; --cds-chart-axis: #48484a; --cds-chart-reference: #8e8e93;
    --cds-surface-popover: #2c2c2e; --cds-border: #38383a; --cds-shadow-popover: 0 10px 15px rgba(0, 0, 0, .3), 0 4px 6px rgba(0, 0, 0, .4); --cds-text-secondary: #98989f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--color-bg); color: var(--color-fg);
    font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body);
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 48px;
  }
  a { color: var(--hig-blue); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  ::selection { background: rgba(0, 122, 255, .3); }
  .site-nav { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; font-size: var(--cds-font-size-body); flex-wrap: wrap; }
  .site-nav nav { display: flex; gap: 20px; }
  .site-nav a { min-height: 44px; display: inline-flex; align-items: center; }
  #dash-root { padding-top: 4px; }
  .site-foot { max-width: 1280px; margin: 40px auto 0; padding-top: 16px; border-top: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  /* Seletores no estilo pop-up do iOS: preenchimento cinza translúcido, sem borda, cápsula */
  .dash-select {
    appearance: none; font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg); font-weight: 400;
    background-color: var(--hig-fill); border: 0; border-radius: 9999px;
    padding: 6px 34px 6px 14px; min-height: 32px; cursor: pointer;
    transition: background-color .15s ease;
    background-image: linear-gradient(45deg, transparent 50%, var(--color-fg-muted) 50%), linear-gradient(135deg, var(--color-fg-muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .dash-select:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(0, 122, 255, .3); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
