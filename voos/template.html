<style>
  /* Tokens que a página do dashboard usa (mesmos nomes do claude.ai) */
  :root {
    color-scheme: light;
    --color-bg: #f6f6f3;
    --color-panel: #ffffff;
    --color-fg: #16181b;
    --color-fg-muted: #5f6166;
    --color-border-line: #e3e2dc;
    --color-ok: #0f7a2e; --color-warn: #9a6400; --color-bad: #c43c3c;
    --cds-chart-muted: #b9b8b1;
    --cds-chart-grid: #ecebe6;
    --cds-chart-axis: #c3c2b7;
    --cds-chart-reference: #898781;
    --cds-surface-popover: #ffffff;
    --cds-border: #dcdbd4;
    --cds-shadow-popover: 0 6px 24px rgba(20, 20, 20, .10);
    --cds-text-secondary: #5f6166;
    --font-anthropic-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-anthropic-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --cds-font-size-caption: .8125rem;
    --cds-font-size-body: .9375rem;
    --cds-font-size-heading: 1.0625rem;
    --cds-font-size-title: 2rem;
    --cds-font-weight-medium: 500;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px; --cds-gap-xl: 40px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 14px; --cds-pad-lg: 20px; --cds-pad-xl: 32px;
    --cds-radius: 8px;
    --cds-dur-slow: .3s;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --color-bg: #121314; --color-panel: #1b1c1e; --color-fg: #eeede8; --color-fg-muted: #a5a49d;
      --color-border-line: #2c2d2f; --color-ok: #3fbf68; --color-warn: #e0a53a; --color-bad: #ef6b6b;
      --cds-chart-muted: #4a4a47; --cds-chart-grid: #26272a; --cds-chart-axis: #3a3b3e; --cds-chart-reference: #8c8b85;
      --cds-surface-popover: #232427; --cds-border: #34353a; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.45); --cds-text-secondary: #a5a49d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-bg: #121314; --color-panel: #1b1c1e; --color-fg: #eeede8; --color-fg-muted: #a5a49d;
    --color-border-line: #2c2d2f; --color-ok: #3fbf68; --color-warn: #e0a53a; --color-bad: #ef6b6b;
    --cds-chart-muted: #4a4a47; --cds-chart-grid: #26272a; --cds-chart-axis: #3a3b3e; --cds-chart-reference: #8c8b85;
    --cds-surface-popover: #232427; --cds-border: #34353a; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.45); --cds-text-secondary: #a5a49d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--color-bg); color: var(--color-fg);
    font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 48px;
  }
  a { color: inherit; }
  .site-nav { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); flex-wrap: wrap; }
  .site-nav a { text-decoration: none; }
  .site-nav a:hover { color: var(--color-fg); text-decoration: underline; text-underline-offset: 3px; }
  .site-nav nav { display: flex; gap: 16px; }
  #dash-root { padding-top: 8px; }
  .site-foot { max-width: 1280px; margin: 40px auto 0; padding-top: 16px; border-top: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  .dash-select {
    appearance: none; font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg);
    background-color: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius);
    padding: 6px 30px 6px 10px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .dash-select:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
